name: Flutter - APK manual

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Solo formato, análisis y pruebas (sin Android)'
        required: false
        default: false
        type: boolean
      test_target:
        description: 'Archivo o directorio de pruebas'
        required: false
        default: 'test'
        type: string
      previous_apk_run_id:
        description: 'Ejecución anterior para comprobar actualización (opcional)'
        required: false
        default: ''
        type: string
      previous_apk_artifact:
        description: 'Nombre del artefacto APK anterior'
        required: false
        default: 'jardin-mecanico-debug-apk'
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validar y generar APK de depuración
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FLUTTER_VERSION: 3.35.7
      FLUTTER_SHA256: 146df531f9ac6a11a918013c1a70faafc053d4811c8cb69a413fd70748d51c3d
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar registros y comprobar proyecto
        run: |
          mkdir -p "$RUNNER_TEMP/flutter-logs"
          if [[ ! -f pubspec.yaml || ! -d android ]]; then
            echo 'Se necesita una aplicación Flutter con destino Android en la raíz del repositorio.' >&2
            exit 1
          fi

      - name: Instalar JDK completo
        if: ${{ !inputs.validation_only }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        if: ${{ !inputs.validation_only }}
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Preparar herramientas Android
        if: ${{ !inputs.validation_only }}
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            'platforms;android-35' 'platforms;android-36' \
            'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1' \
            2>&1 | tee "$RUNNER_TEMP/flutter-logs/android-sdk.log"
          javac -version 2>&1 | tee "$RUNNER_TEMP/flutter-logs/javac.log"

      - name: Instalar Flutter estable y verificar integridad
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 600 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            -o "$RUNNER_TEMP/flutter.tar.xz"
          printf '%s  %s\n' "$FLUTTER_SHA256" "$RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Comprobar SDK y entorno
        run: |
          flutter config --no-analytics
          if [[ "${{ inputs.validation_only }}" != "true" ]]; then
            flutter config --jdk-dir "$JAVA_HOME" --android-sdk "$ANDROID_HOME"
          fi
          flutter --version | tee "$RUNNER_TEMP/flutter-logs/version.log"
          dart --version 2>&1 | tee "$RUNNER_TEMP/flutter-logs/dart.log"
          flutter doctor -v 2>&1 | tee "$RUNNER_TEMP/flutter-logs/doctor.log"

      - name: Resolver dependencias
        run: flutter pub get --enforce-lockfile 2>&1 | tee "$RUNNER_TEMP/flutter-logs/pub-get.log"

      - name: Preparar parche de formato para revisión
        if: ${{ inputs.validation_only }}
        run: |
          dart fix --apply --code=curly_braces_in_flow_control_structures 2>&1 | tee "$RUNNER_TEMP/flutter-logs/style-fix.log"
          dart format lib test tool 2>&1 | tee "$RUNNER_TEMP/flutter-logs/format-prepare.log"
          git diff --binary > "$RUNNER_TEMP/flutter-logs/format.patch"

      - name: Comprobar formato
        run: dart format --output=none --set-exit-if-changed lib test 2>&1 | tee "$RUNNER_TEMP/flutter-logs/format.log"

      - name: Analizar código
        run: flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/flutter-logs/analyze.log"

      - name: Ejecutar pruebas
        env:
          TEST_TARGET: ${{ inputs.test_target || 'test' }}
        run: flutter test --no-pub "$TEST_TARGET" 2>&1 | tee "$RUNNER_TEMP/flutter-logs/test.log"

      - name: Medir simulación E03
        if: ${{ inputs.validation_only && hashFiles('tool/benchmark_evolution.dart') != '' }}
        run: |
          dart compile exe tool/benchmark_evolution.dart -o "$RUNNER_TEMP/evolution-benchmark"
          "$RUNNER_TEMP/evolution-benchmark" | tee "$RUNNER_TEMP/flutter-logs/evolution-benchmark.json"

      - name: Compilar APK de depuración
        if: ${{ !inputs.validation_only }}
        run: flutter build apk --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/flutter-logs/build-apk.log"

      - name: Verificar firma y preparar descarga
        if: ${{ !inputs.validation_only }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-debug.apk \
            2>&1 | tee "$RUNNER_TEMP/flutter-logs/apk-signature.log"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            build/app/outputs/flutter-apk/app-debug.apk \
            > "$RUNNER_TEMP/flutter-logs/apk-manifest.log"
          grep -F "package: name='com.migdlp.incremental_hole_game'" "$RUNNER_TEMP/flutter-logs/apk-manifest.log"
          grep -Fx "application-label:'Feed the Hole'" "$RUNNER_TEMP/flutter-logs/apk-manifest.log"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/feed-the-hole-debug.apk
          cd dist
          sha256sum feed-the-hole-debug.apk > feed-the-hole-debug.apk.sha256

      - name: Comprobar actualización sobre APK anterior
        if: ${{ !inputs.validation_only && inputs.previous_apk_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.previous_apk_run_id }}
          PREVIOUS_ARTIFACT: ${{ inputs.previous_apk_artifact }}
        run: |
          [[ "$PREVIOUS_RUN" =~ ^[0-9]+$ ]]
          previous_dir="$RUNNER_TEMP/previous-apk"
          gh run download "$PREVIOUS_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$PREVIOUS_ARTIFACT" --dir "$previous_dir"
          mapfile -t previous_apks < <(find "$previous_dir" -type f -name '*.apk')
          [[ "${#previous_apks[@]}" -eq 1 ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            "${previous_apks[0]}" > "$RUNNER_TEMP/flutter-logs/previous-apk-signature.log"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            "${previous_apks[0]}" > "$RUNNER_TEMP/flutter-logs/previous-apk-manifest.log"
          old_certificate=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/flutter-logs/previous-apk-signature.log")
          new_certificate=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/flutter-logs/apk-signature.log")
          [[ -n "$old_certificate" && -n "$new_certificate" ]]
          if [[ "$old_certificate" != "$new_certificate" ]]; then
            echo '::error::La firma difiere de la APK anterior. Se necesita su keystore para actualizar conservando los datos.'
            exit 1
          fi
          old_package=$(head -n 1 "$RUNNER_TEMP/flutter-logs/previous-apk-manifest.log" | cut -d "'" -f 2)
          new_package=$(head -n 1 "$RUNNER_TEMP/flutter-logs/apk-manifest.log" | cut -d "'" -f 2)
          old_code=$(head -n 1 "$RUNNER_TEMP/flutter-logs/previous-apk-manifest.log" | cut -d "'" -f 4)
          new_code=$(head -n 1 "$RUNNER_TEMP/flutter-logs/apk-manifest.log" | cut -d "'" -f 4)
          [[ "$old_package" == "$new_package" && "$new_code" -gt "$old_code" ]]
          echo 'Mismo paquete y certificado; versionCode incrementado. Pendiente prueba de instalación en dispositivo.' \
            | tee "$RUNNER_TEMP/flutter-logs/apk-update-check.log"

      - name: Guardar APK descargable
        if: ${{ !inputs.validation_only }}
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: feed-the-hole-debug-apk
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Mostrar enlace de descarga
        if: ${{ !inputs.validation_only }}
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo '### APK de depuración generado' >> "$GITHUB_STEP_SUMMARY"
          echo "[Descargar APK y SHA-256]($APK_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Compilación para pruebas locales, firmada con la clave de depuración; no se publica en tiendas.' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-validation-logs
          path: ${{ runner.temp }}/flutter-logs/
          if-no-files-found: warn
          retention-days: 14
