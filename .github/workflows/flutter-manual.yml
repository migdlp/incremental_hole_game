name: Flutter - APK manual

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-and-build:
    name: Validar y generar APK de depuración
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FLUTTER_VERSION: 3.35.7
      FLUTTER_SHA256: 146df531f9ac6a11a918013c1a70faafc053d4811c8cb69a413fd70748d51c3d
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar registros y comprobar proyecto
        run: |
          mkdir -p "$RUNNER_TEMP/flutter-logs"
          if [[ ! -f pubspec.yaml || ! -d android ]]; then
            echo 'Se necesita una aplicación Flutter con destino Android en la raíz del repositorio.' >&2
            exit 1
          fi

      - name: Instalar JDK completo
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar herramientas Android
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            'platforms;android-35' 'platforms;android-36' \
            'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1' \
            2>&1 | tee "$RUNNER_TEMP/flutter-logs/android-sdk.log"
          javac -version 2>&1 | tee "$RUNNER_TEMP/flutter-logs/javac.log"

      - name: Instalar Flutter estable y verificar integridad
        run: |
          curl -fL --retry 3 --connect-timeout 20 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            -o "$RUNNER_TEMP/flutter.tar.xz"
          printf '%s  %s\n' "$FLUTTER_SHA256" "$RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Comprobar SDK y entorno
        run: |
          flutter config --no-analytics --jdk-dir "$JAVA_HOME" --android-sdk "$ANDROID_HOME"
          flutter --version | tee "$RUNNER_TEMP/flutter-logs/version.log"
          dart --version 2>&1 | tee "$RUNNER_TEMP/flutter-logs/dart.log"
          flutter doctor -v 2>&1 | tee "$RUNNER_TEMP/flutter-logs/doctor.log"

      - name: Resolver dependencias
        run: flutter pub get 2>&1 | tee "$RUNNER_TEMP/flutter-logs/pub-get.log"

      - name: Comprobar formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analizar código
        run: flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/flutter-logs/analyze.log"

      - name: Ejecutar pruebas
        run: flutter test --no-pub 2>&1 | tee "$RUNNER_TEMP/flutter-logs/test.log"

      - name: Compilar APK de depuración
        run: flutter build apk --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/flutter-logs/build-apk.log"

      - name: Verificar firma y preparar descarga
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            build/app/outputs/flutter-apk/app-debug.apk \
            2>&1 | tee "$RUNNER_TEMP/flutter-logs/apk-signature.log"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/jardin-mecanico-debug.apk
          cd dist
          sha256sum jardin-mecanico-debug.apk > jardin-mecanico-debug.apk.sha256

      - name: Guardar APK descargable
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: jardin-mecanico-debug-apk
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Mostrar enlace de descarga
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo '### APK de depuración generado' >> "$GITHUB_STEP_SUMMARY"
          echo "[Descargar APK y SHA-256]($APK_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Compilación para pruebas locales, firmada con la clave de depuración; no se publica en tiendas.' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-validation-logs
          path: ${{ runner.temp }}/flutter-logs/
          if-no-files-found: warn
          retention-days: 14
