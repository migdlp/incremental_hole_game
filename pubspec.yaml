name: incremental_hole_game
description: Feed the Hole, un juego incremental de empujar y recoger.
publish_to: none
version: 0.22.0+35

environment:
  sdk: '>=3.9.2 <4.0.0'
  flutter: '>=3.35.7'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.35.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - docs/balance.csv
    - assets/audio/manifest.json
    - assets/audio/feedback.json
    - assets/audio/sfx/
